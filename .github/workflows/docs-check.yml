name: Documentation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs-style:
    name: docs-style
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test documentation checker
        run: python tests/docs-style/test-check-docs.py
      - name: Check documentation
        run: python scripts/check-docs.py
      - name: Test workflow checker
        run: python tests/workflow-checks/test-check-workflow.py
      - name: Check records, links and commit messages
        env:
          COMMIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/check-workflow.py --commit-base "$COMMIT_BASE" --commit-head "$COMMIT_HEAD"
